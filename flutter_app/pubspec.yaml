name: anajak_travel
description: A calm, Cambodia-first travel companion. UI demonstration.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.1
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  intl: 0.20.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0
  file_picker: ^13.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  image_picker: ^1.2.3
  geolocator: ^14.1.1
  url_launcher: ^6.3.3
  app_links: ^7.2.2
  google_maps_flutter: ^2.18.1
  timezone: ^0.11.2
  crystal_navigation_bar: ^2.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - lib/app/localization/
  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
    - family: NotoSansKhmer
      fonts:
        - asset: assets/fonts/NotoSansKhmer.ttf
