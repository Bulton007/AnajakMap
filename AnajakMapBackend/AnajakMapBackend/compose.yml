    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USER: JOURNAL
      DB_PASSWORD: ${JOURNAL_DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
