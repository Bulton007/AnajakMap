volumes:
  oracle-data:
  redis-data:
  rabbit-data:
  object-data:
  identity-logs:
  trip-logs:
  ai-guide-logs:
  discovery-logs:
  expense-logs:
  reservation-logs:
  journal-logs:
  notification-logs:
  gateway-logs:
