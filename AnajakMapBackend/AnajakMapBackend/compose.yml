name: anajakmap
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Run scripts/init-dev.sh}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      TRIP_DB_PASSWORD: ${TRIP_DB_PASSWORD}
      AI_GUIDE_DB_PASSWORD: ${AI_GUIDE_DB_PASSWORD}
      DISCOVERY_DB_PASSWORD: ${DISCOVERY_DB_PASSWORD}
      EXPENSE_DB_PASSWORD: ${EXPENSE_DB_PASSWORD}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD}
      JOURNAL_DB_PASSWORD: ${JOURNAL_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
      IDENTITY_APP_PASSWORD: ${IDENTITY_APP_PASSWORD}
      TRIP_APP_PASSWORD: ${TRIP_APP_PASSWORD}
      AI_GUIDE_APP_PASSWORD: ${AI_GUIDE_APP_PASSWORD}
      DISCOVERY_APP_PASSWORD: ${DISCOVERY_APP_PASSWORD}
      EXPENSE_APP_PASSWORD: ${EXPENSE_APP_PASSWORD}
      RESERVATION_APP_PASSWORD: ${RESERVATION_APP_PASSWORD}
      JOURNAL_APP_PASSWORD: ${JOURNAL_APP_PASSWORD}
      NOTIFICATION_APP_PASSWORD: ${NOTIFICATION_APP_PASSWORD}
      GATEWAY_APP_PASSWORD: ${GATEWAY_APP_PASSWORD}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./deploy/oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass $$REDIS_PASSWORD"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: ["redis-data:/data"]
  rabbitmq:
    image: rabbitmq:4.1-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${OBJECT_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_SECRET_KEY}
    volumes: ["object-data:/data"]
  object-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    environment:
      OBJECT_ACCESS_KEY: ${OBJECT_ACCESS_KEY}
      OBJECT_SECRET_KEY: ${OBJECT_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c", "until mc alias set local http://minio:9000 $$OBJECT_ACCESS_KEY $$OBJECT_SECRET_KEY; do sleep 2; done; mc mb --ignore-existing local/anajak-media"]
  identity-service:
    build:
      context: .
      args:
        SERVICE: identity
    environment:
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      AUTH_TERMS_URL: ${AUTH_TERMS_URL:-}
      AUTH_PRIVACY_URL: ${AUTH_PRIVACY_URL:-}
      AUTH_POLICY_VERSION: ${AUTH_POLICY_VERSION:-}
      AUTH_LINK_BASE: ${AUTH_LINK_BASE:-}
      MAIL_PROVIDER_URL: ${MAIL_PROVIDER_URL:-}
      MAIL_PROVIDER_KEY: ${MAIL_PROVIDER_KEY:-}
      SPRING_PROFILES_ACTIVE: dev
      DB_USER: IDENTITY
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      OBJECT_ACCESS_KEY: ${OBJECT_ACCESS_KEY}
      OBJECT_SECRET_KEY: ${OBJECT_SECRET_KEY}
    depends_on:
      oracle:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      object-init:
        condition: service_completed_successfully
    volumes:
      - identity-logs:/opt/anajakmap/logs
  trip-service:
    build:
      context: .
      args:
        SERVICE: trip
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USER: TRIP
      DB_PASSWORD: ${TRIP_DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      OBJECT_ACCESS_KEY: ${OBJECT_ACCESS_KEY}
      OBJECT_SECRET_KEY: ${OBJECT_SECRET_KEY}
    depends_on:
      oracle:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      object-init:
        condition: service_completed_successfully
    volumes:
      - trip-logs:/opt/anajakmap/logs
  ai-guide-service:
    build:
      context: .
      args:
        SERVICE: ai-guide
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USER: AI_GUIDE
      DB_PASSWORD: ${AI_GUIDE_DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      OBJECT_ACCESS_KEY: ${OBJECT_ACCESS_KEY}
      OBJECT_SECRET_KEY: ${OBJECT_SECRET_KEY}
    depends_on:
      oracle:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      object-init:
        condition: service_completed_successfully
    volumes:
      - ai-guide-logs:/opt/anajakmap/logs
  discovery-service:
