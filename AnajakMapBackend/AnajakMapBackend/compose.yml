  gateway-service:
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:7777,http://127.0.0.1:7777}
      SPRING_PROFILES_ACTIVE: dev
      DB_USER: GATEWAY
      DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
