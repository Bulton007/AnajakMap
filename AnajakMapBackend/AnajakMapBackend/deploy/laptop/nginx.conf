worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;
    # Never log query strings, request bodies, authorization or reset codes.
    log_format limited '$remote_addr [$time_local] "$request_method $uri" $status $request_time';
    access_log /dev/stdout limited;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_x_forwarded_proto $external_scheme {
        default $scheme;
        https https;
    }
    server {
        listen 8080;
        client_max_body_size 11m;
        client_body_timeout 30s;
        send_timeout 70s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        # Confirms Nginx only. Backend readiness is checked privately by script.
        location = /healthz { access_log off; return 204; }
        location /api/v1/ {
            set $gateway http://gateway-service:8089;
            proxy_pass $gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 70s;
            proxy_send_timeout 70s;
            proxy_buffering off;
            proxy_redirect off;
        }
        # No public actuator, Swagger, internal service routes or files.
        location / { return 404 '{"error":"NOT_FOUND"}'; }
    }
}
