apiVersion: batch/v1
kind: Job
metadata:
  name: identity-migrate-v1
  namespace: anajakmap
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: image-registry.openshift-image-registry.svc:5000/anajakmap/identity-service:0.1.0
          envFrom:
            - configMapRef:
                name: identity-service-config
            - secretRef:
                name: identity-migration-secrets
          env:
            - name: MIGRATE_ONLY
              value: 'true'
            - name: DB_USER
              value: IDENTITY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
---
