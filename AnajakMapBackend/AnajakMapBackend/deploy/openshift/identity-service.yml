apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identity-logs
  namespace: anajakmap
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: anajakmap
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/anajakmap/identity-service:0.1.0
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: identity-service-config
            - secretRef:
                name: identity-service-secrets
          env:
            - name: DB_USER
              value: IDENTITY_APP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: '1'
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
          volumeMounts:
            - name: logs
              mountPath: /opt/anajakmap/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: identity-logs
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: anajakmap
spec:
  selector:
    app: identity-service
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-service-config
  namespace: anajakmap
data:
  SPRING_PROFILES_ACTIVE: production
  SPRING_FLYWAY_ENABLED: "false"
  DB_INIT_SQL: ALTER SESSION SET CURRENT_SCHEMA=IDENTITY
  DB_URL: jdbc:oracle:thin:@oracle.internal:1521/FREEPDB1
  REDIS_HOST: redis
  RABBIT_HOST: rabbitmq
  OBJECT_URL: http://minio:9000
  TRIP_URL: http://trip-service:8082
  AI_URL: http://ai-guide-service:8083
  DISCOVERY_URL: http://discovery-service:8084
