apiVersion: batch/v1
kind: Job
metadata:
  name: object-init
  namespace: anajakmap-local
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: init
          image: anajakmap/mc:local-2025-04-16
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - 'until mc alias set local http://minio:9000 "$OBJECT_ACCESS_KEY" "$OBJECT_SECRET_KEY"; do sleep 2; done; mc mb --ignore-existing local/anajak-media'
          envFrom:
            - secretRef: {name: infrastructure-secrets}
          volumeMounts:
            - {name: config, mountPath: /.mc}
      volumes:
        - name: config
          emptyDir: {}
