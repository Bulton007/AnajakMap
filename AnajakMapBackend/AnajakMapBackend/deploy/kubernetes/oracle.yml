apiVersion: v1
kind: Service
metadata:
  name: oracle
  namespace: anajakmap-local
spec:
  selector: {app: oracle}
  ports: [{port: 1521, targetPort: 1521}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle
  namespace: anajakmap-local
spec:
  serviceName: oracle
  replicas: 1
  selector:
    matchLabels: {app: oracle}
  template:
    metadata:
      labels: {app: oracle}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 54321
      containers:
        - name: oracle
          image: container-registry.oracle.com/database/free:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: oracle-secrets}
          ports: [{containerPort: 1521}]
          startupProbe:
            tcpSocket: {port: 1521}
            failureThreshold: 180
            periodSeconds: 5
          readinessProbe:
            exec:
              command: [bash, -c, "echo 'SELECT 1 FROM dual;' | sqlplus -s / as sysdba | grep -q 1"]
            timeoutSeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: '500m', memory: 2Gi}
            limits: {cpu: '2', memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /opt/oracle/oradata}
            - {name: scripts, mountPath: /opt/oracle/scripts/setup, readOnly: true}
      volumes:
        - name: scripts
          configMap:
            name: oracle-scripts
            items:
              - {key: 01-schemas.sh, path: 01-schemas.sh}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 30Gi}
