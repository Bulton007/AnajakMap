apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: anajakmap-local
spec:
  selector:
    app: minio
  ports:
    - port: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: anajakmap-local
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      securityContext:
        fsGroup: 1001
      automountServiceAccountToken: false
      containers:
        - name: minio
          imagePullPolicy: IfNotPresent
          image: anajakmap/minio:local-2025-04-22
          args: ["server", "/data"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: infrastructure-secrets
                  key: OBJECT_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infrastructure-secrets
                  key: OBJECT_SECRET_KEY
          ports:
            - containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: 9000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
