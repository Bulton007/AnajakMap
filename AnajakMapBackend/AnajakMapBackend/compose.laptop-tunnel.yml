# Explicit opt-in: a temporary public HTTPS URL; not a stable store endpoint.
services:
  laptop-tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://nginx:8080"]
    restart: unless-stopped
    depends_on:
      nginx: {condition: service_healthy}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 128m
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
