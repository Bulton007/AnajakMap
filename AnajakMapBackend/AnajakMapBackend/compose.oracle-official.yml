services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    environment:
      ORACLE_PWD: ${ORACLE_PASSWORD}
    volumes:
      - ./deploy/oracle:/opt/oracle/scripts/setup:ro
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM dual;' | sqlplus -s / as sysdba | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 60
